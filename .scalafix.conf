rules = [MultilineBlockBraces, DisableSyntax, PackageLayers]

// Bottom first, as `src/scalafix/…/PackageLayers.scala` reads them (#504). `ccas.analysis` alone holds `GameScoring`;
// `.scalafix-test.conf` clears these for the tests.
PackageLayers.layers = [
  ccas.info
  ccas.utils
  ccas.api
  ccas.analysis.tables
  ccas.analysis
  ccas.analysis.apps
  ccas.server
  ccas.cli
]

// The time comes from ZIO's Clock, so a test's TestClock can move it (#509). Test sources build fixtures from the wall
// clock on purpose, so `.scalafix-test.conf` clears these.
DisableSyntax.regex = [
  {
    id = wallClock
    pattern = """(?:Instant|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|OffsetTime|ZonedDateTime|YearMonth|MonthDay|Year)\.now\b|\bSystem\.currentTimeMillis\b|Clock\.system\w*\(|\bClockLive\b|\bnew (?:java\.util\.)?Date\(\)|\bCalendar\.getInstance\b"""
    message = "Read the time with Clock.instant, so a TestClock can move it"
  }
  {
    id = sqlClock
    pattern = """(?i)(?<![.\w])(?:now|clock_timestamp|statement_timestamp|transaction_timestamp|timeofday)\s*\(\)|\bcurrent_(?:timestamp|date|time)\b|'(?:now|today|tomorrow|yesterday)'|(?-i:\b(?:LOCALTIMESTAMP|localtimestamp|LOCALTIME|localtime)\b)"""
    message = "Pass in an instant read with Clock.instant rather than reading the database's clock"
  }
]
