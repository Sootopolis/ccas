# A version bump reformats the tree (3.11.5 changes about 700 lines), so give it a change of its own (#360).
version = "3.8.6"

runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.defnSite = 2

trailingCommas = never

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  Imports,
  PreferCurlyFors
]

# Keep the braces an author wrote round a `try`, a block or a method body. RedundantBraces still turns a one-line
# `f { x => … }` into `f(x => …)`.
rewrite.redundantBraces.generalExpressions = false
rewrite.redundantBraces.defnBodies = none

# Import grouping: java, scala, third-party, a relative import such as `HistoryUtils.*`, then the project (#187)
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [
  ["java\\..*", "javax\\..*"],
  ["scala\\..*"],
  ["(?!ccas\\.)[a-z_].*"],
  ["[A-Z].*"],
  ["ccas\\..*"]
]

# Keep scaladoc as written: rewrapping reflows a whole paragraph whenever one word in it changes.
docstrings.wrap = keep

# Alignment
align.preset = more
align.openParenDefnSite = false
align.openParenCallSite = false
align.tokens."+" = [
  { code = "%%", owner = "Term.ApplyInfix" },
  { code = "%", owner = "Term.ApplyInfix" },
  { code = ":=", owner = "Term.ApplyInfix" }
]

# Dangling parentheses on own line
danglingParentheses.defnSite = true
danglingParentheses.callSite = true

# One-param-per-line for long definitions (config style)
newlines.configStyleDefnSite.prefer = true

# Keep Scala 2 if/for syntax (no then/do conversion)
rewrite.scala3.convertToNewSyntax = false

newlines.beforeCurlyLambdaParams = never
newlines.selectChains = keep

# Literal casing
literals.long = Upper
literals.float = Upper
literals.double = Upper
literals.hexDigits = Upper

assumeStandardLibraryStripMargin = true

project.git = true
