name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccas
          POSTGRES_USER: ccas
          POSTGRES_PASSWORD: ccas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccas -d ccas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Create test schema
        run: psql -h localhost -U ccas -d ccas -c "CREATE SCHEMA IF NOT EXISTS test;"
        env:
          PGPASSWORD: ccas

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Run tests
        run: sbt test
        env:
          CCAS_CONTACT_EMAIL: ci@ccas.dev
