name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccas_test
          POSTGRES_USER: ccas
          POSTGRES_PASSWORD: ccas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccas -d ccas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test
        env:
          CCAS_CONTACT_EMAIL: ci@ccas.dev

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test results
          # Unanchored on purpose: a `**/target/test-reports/` form stops matching if the output layout moves
          # (sbt 2 nests it under `target/out/`), and `if: always()` means a stale glob reports an empty run.
          path: '**/test-reports/TEST-*.xml'
          reporter: java-junit
