name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccas
          POSTGRES_USER: ccas
          POSTGRES_PASSWORD: ccas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccas -d ccas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Create test schema
        run: psql -h localhost -U ccas -d ccas -c "CREATE SCHEMA IF NOT EXISTS test;"
        env:
          PGPASSWORD: ccas

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test
        env:
          CCAS_CONTACT_EMAIL: ci@ccas.dev

      - name: Test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          include_passed: true
