// The test sources' scalafix config: every rule `.scalafix.conf` sets, less its clock and config patterns, since a
// fixture may read the wall clock or build a config of its own (#509), and less its package layers, since a test may
// reach any layer to set up its subject (#504).
include ".scalafix.conf"
DisableSyntax.regex = []
PackageLayers.layers = []
