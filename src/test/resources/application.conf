job-logs {
  directory = "target/test-job-logs"
}

chess-com-client {
  contact-email = "test@test.com"
  recovery-tiers = [2, 4]
  cooldown-seconds = 1
  cf-cooldown-seconds = 1
  failure-window-size = 20
  failure-threshold = 0.2
  min-sample-size = 10
  min-request-delay-ms = 0
  ema-tau-ms = 500
  min-tier-observation-seconds = 0
  retry-base-seconds = 1
  cf-retry-delay-seconds = 1
  connection-retry-base-seconds = 1
  max-429-retries = 2
  max-cf-retries = 1
  max-connection-retries = 2
  stats-flush-interval-seconds = 30
}
# Cached response bodies use the local-filesystem BodyStore in tests (no R2 creds needed in CI). Each suite's
# FreshSchemaLayer isolates DB rows; the fs-root is a throwaway target/ dir.
body-store {
  backend = "fs"
  fs-root = "target/test-bodies"
}

# Cache retention is DB-owned (app_setting.cache_retention_days, compiled default 60d) and no longer runs from
# `ensureTables` — only `CcasServer` sweeps, so a suite's mocked-old fixtures survive unless it calls
# `Tables.retentionSweep` itself (TestRetentionSweep does, in its own schema). No HOCON override needed.

# No `url` key here on purpose — but note it does not stay absent by itself. `ConfigFactory.load()` merges every
# `application.conf` on the classpath, and the main one contributes `url = ${?DATABASE_URL}`, which has no duplicate
# here to lose to. Export DATABASE_URL (direnv, or `set -a; source ccas.env`) and the whole suite silently follows it,
# production included. Setting `url = null` here would hide the key the way `databaseNoSchema` hides `currentSchema`;
# that is deliberately NOT done yet, because `FreshSchemaLayer` refuses any database not named `*_test` and a loud
# refusal beats a silent redirect. Add the null only when a dev shell exports DATABASE_URL as a matter of course.
database = {
  dataSource = {
    user = ccas
    password = ccas
    databaseName = ccas_test
    # Follows the same DB_PORT knob as docker-compose.yml, so moving the dev database off a taken 5432 does not
    # leave the tests pointing at whatever else is on the default port.
    portNumber = 5432
    portNumber = ${?DB_PORT}
    serverName = localhost
    currentSchema = public
  }
  pool = {
    maximumPoolSize   = 3
    minimumIdle       = 1
    connectionTimeout = 30000
    # Mirror prod driver-level socket hardening so the addDataSourceProperty path is exercised under test.
    socketTimeoutSeconds  = 30
    connectTimeoutSeconds = 10
    tcpKeepAlive          = true
  }
}

# Mirrors `database` but with `currentSchema` removed (set to null → hasPath false), reproducing the prod `DB_*`
# path when `DB_SCHEMA` is unset. Used by TestPostgresClient to assert `live` builds the pool without throwing.
databaseNoSchema = ${database}
databaseNoSchema.dataSource.currentSchema = null
