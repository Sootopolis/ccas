chess-com-client {
  contact-email = "test@test.com"
  recovery-tiers = [2, 4]
  cooldown-seconds = 1
  cf-cooldown-seconds = 1
  failure-window-size = 20
  failure-threshold = 0.2
  min-sample-size = 10
  min-request-delay-ms = 0
  min-tier-observation-seconds = 0
  retry-base-seconds = 1
  cf-retry-delay-seconds = 1
  connection-retry-base-seconds = 1
  max-429-retries = 2
  max-cf-retries = 1
  max-connection-retries = 2
  stats-flush-interval-seconds = 30
}

database = {
  dataSource = {
    user = ccas
    password = ccas
    databaseName = ccas_test
    portNumber = 5432
    serverName = localhost
    currentSchema = public
  }
  pool = {
    maximumPoolSize   = 3
    minimumIdle       = 1
    connectionTimeout = 30000
  }
}
