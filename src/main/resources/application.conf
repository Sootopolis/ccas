server {
  port = 8080
  port = ${?SERVER_PORT}
}

scheduler {
  pollIntervalMinutes = 5
  pollIntervalMinutes = ${?SCHEDULER_POLL_MINUTES}
}

chess-com-client {
  contact-email = ${CCAS_CONTACT_EMAIL}
  permits = 16
  permits = ${?CHESS_COM_API_PERMITS}
  cooldown-seconds = 30
  cooldown-seconds = ${?CHESS_COM_API_COOLDOWN_SECONDS}
  failure-window-size = 20
  failure-window-size = ${?CHESS_COM_API_FAILURE_WINDOW_SIZE}
  failure-threshold = 0.2
  failure-threshold = ${?CHESS_COM_API_FAILURE_THRESHOLD}
  min-sample-size = 10
  min-sample-size = ${?CHESS_COM_API_MIN_SAMPLE_SIZE}
  single-retry-delay-seconds = 5
  single-retry-delay-seconds = ${?CHESS_COM_API_SINGLE_RETRY_DELAY_SECONDS}
  cf-retry-delay-seconds = 10
  cf-retry-delay-seconds = ${?CHESS_COM_API_CF_RETRY_DELAY_SECONDS}
  throttle-delay-millis = 100
  throttle-delay-millis = ${?CHESS_COM_API_THROTTLE_DELAY_MILLIS}
}

database = {
  # JDBC URL — if set, takes priority over individual dataSource fields below.
  # Format: jdbc:postgresql://host/db?user=x&password=x&sslmode=require
  url = ${?DATABASE_URL}

  dataSource = {
    user           = ${DB_USER}
    password       = ${DB_PASSWORD}
    databaseName   = ${DB_NAME}
    portNumber     = ${DB_PORT}
    serverName     = ${DB_HOST}
    currentSchema  = ${DB_SCHEMA}
  }
  pool = {
    maximumPoolSize   = 20
    maximumPoolSize   = ${?DB_POOL_MAX}
    minimumIdle       = 2
    minimumIdle       = ${?DB_POOL_MIN_IDLE}
    connectionTimeout = 30000
    idleTimeout       = 600000
    maxLifetime       = 1800000
  }
}
