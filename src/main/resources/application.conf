server {
  port = 8080
  port = ${?SERVER_PORT}
  # Bind address. Defaults to loopback for the single-user, no-auth local model (epic #40); hosted/deployed
  # entry points (e.g. the `ccas-server` binary on Render, #60) set SERVER_HOST=0.0.0.0 to accept external traffic.
  host = "127.0.0.1"
  host = ${?SERVER_HOST}
}

job-logs {
  # Directory where per-job log files (`<jobId>.log`) are written by JobRunner. Created on first job submit.
  directory = "logs/jobs"
  directory = ${?JOB_LOGS_DIR}
}

scheduler {
  # Neon free tier auto-suspends compute after ~5 min idle. A 5-min poll keeps it always-warm and blows the
  # 192 active-hr/mo budget within ~9 days. 15 min lets the compute sleep between polls.
  pollIntervalMinutes = 15
  pollIntervalMinutes = ${?SCHEDULER_POLL_MINUTES}

  # Boot-seed defaults for the global server-internal maintenance jobs (MatchRef, ClubData). These are
  # all-clubs sweeps users cannot trigger manually, so without a seeded schedule they never run on a fresh
  # deployment. Seed-only: applied via INSERT ... WHERE NOT EXISTS on first boot. Once a row exists it is the
  # live truth (editable via `ccas schedule` / ScheduleRoutes); later edits to these values are NOT re-applied.
  # Set enabled = false to seed a present-but-disabled row. Per-club jobs (History, Membership, ...) are not
  # seeded here — they are configured per managed club.
  defaults {
    matchRef {
      intervalHours = 24
      intervalHours = ${?SCHEDULER_MATCHREF_INTERVAL_HOURS}
      enabled = true
      enabled = ${?SCHEDULER_MATCHREF_ENABLED}
    }
    clubData {
      intervalHours = 6
      intervalHours = ${?SCHEDULER_CLUBDATA_INTERVAL_HOURS}
      enabled = true
      enabled = ${?SCHEDULER_CLUBDATA_ENABLED}
    }
  }
}

chess-com-client {
  contact-email = ${CCAS_CONTACT_EMAIL}
  recovery-tiers = [2, 4, 6, 8]
  recovery-tiers = ${?CHESS_COM_API_RECOVERY_TIERS}
  cooldown-seconds = 15
  cooldown-seconds = ${?CHESS_COM_API_COOLDOWN_SECONDS}
  cf-cooldown-seconds = 30
  cf-cooldown-seconds = ${?CHESS_COM_API_CF_COOLDOWN_SECONDS}
  failure-window-size = 40
  failure-window-size = ${?CHESS_COM_API_FAILURE_WINDOW_SIZE}
  failure-threshold = 0.2
  failure-threshold = ${?CHESS_COM_API_FAILURE_THRESHOLD}
  min-sample-size = 15
  min-sample-size = ${?CHESS_COM_API_MIN_SAMPLE_SIZE}
  min-request-delay-ms = 75
  min-request-delay-ms = ${?CHESS_COM_API_MIN_REQUEST_DELAY_MS}
  ema-tau-ms = 500
  ema-tau-ms = ${?CHESS_COM_API_EMA_TAU_MS}
  min-tier-observation-seconds = 10
  min-tier-observation-seconds = ${?CHESS_COM_API_MIN_TIER_OBSERVATION_SECONDS}
  retry-base-seconds = 1
  retry-base-seconds = ${?CHESS_COM_API_RETRY_BASE_SECONDS}
  cf-retry-delay-seconds = 10
  cf-retry-delay-seconds = ${?CHESS_COM_API_CF_RETRY_DELAY_SECONDS}
  connection-retry-base-seconds = 1
  connection-retry-base-seconds = ${?CHESS_COM_API_CONNECTION_RETRY_BASE_SECONDS}
  max-429-retries = 5
  max-429-retries = ${?CHESS_COM_API_MAX_429_RETRIES}
  max-cf-retries = 2
  max-cf-retries = ${?CHESS_COM_API_MAX_CF_RETRIES}
  max-connection-retries = 3
  max-connection-retries = ${?CHESS_COM_API_MAX_CONNECTION_RETRIES}
  stats-flush-interval-seconds = 30
  stats-flush-interval-seconds = ${?CHESS_COM_API_STATS_FLUSH_INTERVAL_SECONDS}

  cache {
    # Retention window for api_response_cache, in days. Tables.ensureTables prunes older rows on every app startup;
    # chained orphan cleanup then drops any api_response_body rows no longer referenced by cache or failure tables.
    retention-days = 7
    retention-days = ${?CHESS_COM_API_CACHE_RETENTION_DAYS}
  }
}

database = {
  # JDBC URL — if set, takes priority over individual dataSource fields below.
  # Format: jdbc:postgresql://host/db?user=x&password=x&sslmode=require
  url = ${?DATABASE_URL}

  # Used only when `url` is absent. All fields optional via ${?VAR}; missing fields
  # surface as ConfigException at startup when the dataSource branch is taken.
  dataSource = {
    user           = ${?DB_USER}
    password       = ${?DB_PASSWORD}
    databaseName   = ${?DB_NAME}
    portNumber     = ${?DB_PORT}
    serverName     = ${?DB_HOST}
    currentSchema  = ${?DB_SCHEMA}
  }
  pool = {
    maximumPoolSize   = 20
    maximumPoolSize   = ${?DB_POOL_MAX}
    minimumIdle       = 2
    minimumIdle       = ${?DB_POOL_MIN_IDLE}
    connectionTimeout = 30000
    connectionTimeout = ${?DB_POOL_CONNECTION_TIMEOUT}
    idleTimeout       = 600000
    idleTimeout       = ${?DB_POOL_IDLE_TIMEOUT}
    maxLifetime       = 1800000
    maxLifetime       = ${?DB_POOL_MAX_LIFETIME}
    keepaliveTime             = 120000
    keepaliveTime             = ${?DB_POOL_KEEPALIVE_TIME}
    connectionTestQuery       = "SELECT 1"
    connectionTestQuery       = ${?DB_POOL_CONNECTION_TEST_QUERY}
    initializationFailTimeout = -1
    initializationFailTimeout = ${?DB_POOL_INIT_FAIL_TIMEOUT}
    # Driver-level (pgjdbc) socket hardening, applied to every connection regardless of host. socketTimeout bounds
    # every socket read (queries included) so a silently-dropped connection raises SQLState 08006 — caught by the
    # transient-retry — instead of parking the JDBC thread forever. In SECONDS; set above the slowest legit query.
    socketTimeoutSeconds      = 60
    socketTimeoutSeconds      = ${?DB_SOCKET_TIMEOUT_SECONDS}
    connectTimeoutSeconds     = 10
    connectTimeoutSeconds     = ${?DB_CONNECT_TIMEOUT_SECONDS}
    tcpKeepAlive              = true
    tcpKeepAlive              = ${?DB_TCP_KEEP_ALIVE}
  }
  retry = {
    baseDelayMs = 100
    baseDelayMs = ${?DB_RETRY_BASE_DELAY_MS}
    maxRetries  = 3
    maxRetries  = ${?DB_RETRY_MAX_RETRIES}
  }
}
